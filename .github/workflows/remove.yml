name: Usuwanie dane co 12 godzin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'

jobs:
  run-python-script:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Remove data
        run: |
          rm -rf Data

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git fetch
          git add .
          git commit -am "Automated removal from GitHub Actions" || echo "No changes to commit"
          git push origin main
