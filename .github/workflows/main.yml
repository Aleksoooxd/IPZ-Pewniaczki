name: Aktualizacja danych co 12 godzin

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'

jobs:
  run-python-script:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run runBiDaily.py
        run: python src/runBiDaily.py

      - name: Show changes
        run: |
          echo "==== GIT STATUS ===="
          git status
          echo "==== GIT DIFF ===="
          git diff
          echo "==== CONTENTS OF Data FOLDER ===="
          ls -l Data || echo "Brak folderu Data"

      - name: Checkout repository2
        uses: actions/checkout@v3

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        run: |
          git add -f -A Data/\*.csv
          # Próba commita - jeśli brak zmian, polecenie się nie powiedzie, ale nie przerywamy joba
          git commit -m "Automated update from GitHub Actions" || echo "No changes to commit"
          git push
