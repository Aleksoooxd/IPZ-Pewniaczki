{% extends "base.html" %}

{% block title %}{{ _('Test bazy danych') }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/test_db.css') }}">
{% endblock %}

{% block content %}
<div class="test-db-container card">
    <h1 class="page-title">{{ _('Test połączenia z bazą danych') }}</h1>
    <div class="status-message {{ 'success' if '✅' in status else 'error' if '❌' in status else 'warning' }}">
        {{ status }}
    </div>
    <a href="{{ url_for('main.home') }}" class="button secondary">← {{ _('Wróć do strony głównej') }}</a>
</div>
{% endblock %}
