<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Pewniaczki{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header>
    <div class="logo">
      <img src="/static/pewniaczkilogo.png" alt="Logo" />
      <p>Predykcje wyników meczów piłkarskich</p>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    &copy; 2025 Pewniaczki ⚽ Wszystkie prawa zastrzeżone.
  </footer>

  {% block script %}{% endblock %}
</body>
</html>
