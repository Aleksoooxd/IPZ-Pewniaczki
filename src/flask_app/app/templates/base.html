<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Pewniaczki{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  {% block extra_css %}{% endblock %}
</head>
<body>
  <header>
    <a href="{{ url_for('main.mainpage') }}" class="logo">
      <img src="/static/pewniaczkilogo.png" alt="Logo" />
      <p>Predykcje wyników meczów piłkarskich</p>
    </a>
    <button id="theme-toggle" class="theme-toggle">
      <span class="icon light-icon">☀️</span>
      <span class="icon dark-icon">🌙</span>
    </button>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    &copy; 2025 Pewniaczki ⚽ Wszystkie prawa zastrzeżone.
  </footer>

  <script src="{{ url_for('static', filename='js/theme-toggle.js') }}"></script>
  {% block extra_script %}{% endblock %}
</body>
</html>
