<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Pewniaczki{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  {% block extra_css %}{% endblock %}

  <style>
    body {
      visibility: hidden;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }
    body.theme-loaded {
      visibility: visible;
      opacity: 1;
    }
  </style>

</head>
<body>
  <header>
    <a href="{{ url_for('main.mainpage') }}" class="logo">
      <img src="/static/pewniaczkilogo.png" alt="Logo" />
      <p>Predykcje wyników meczów piłkarskich</p>
    </a>
    <button id="theme-toggle" class="theme-toggle">
      <span class="icon light-icon">☀️</span>
      <span class="icon dark-icon">🌙</span>
    </button>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer>
    &copy; 2025 Pewniaczki ⚽ Wszystkie prawa zastrzeżone.
  </footer>

  {# Scroll to top button #}
  <button id="scrollToTopBtn" class="scroll-to-top-btn">
    ⬆
    <span>TOP</span>
  </button>

  <script src="{{ url_for('static', filename='js/theme-toggle.js') }}"></script>
  <script>

    const scrollToTopBtn = document.getElementById("scrollToTopBtn");


    window.onscroll = function() {
      if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
        scrollToTopBtn.style.display = "block";
      } else {
        scrollToTopBtn.style.display = "none";
      }
    };


    scrollToTopBtn.addEventListener("click", function() {

      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    });
  </script>
  {% block extra_script %}{% endblock %}
</body>
</html>
