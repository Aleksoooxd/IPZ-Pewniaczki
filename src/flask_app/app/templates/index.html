<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pewniaczki - Predykcje meczów piłkarskich</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      background: repeating-linear-gradient(
        90deg,
        #2ecc71,
        #2ecc71 60px,
        #27ae60 60px,
        #27ae60 120px
      );
      overflow: hidden;
      position: relative;
      color: white;
    }

    /* Linia środkowa */
    .mid-line {
      position: fixed;
      top: 0;
      left: 50%;
      width: 4px;
      height: 100%;
      background: white;
      opacity: 0.5;
      transform: translateX(-2px);
      z-index: 0;
    }

    /* Koło środkowe */
    .center-circle {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 200px;
      height: 200px;
      margin-left: -100px;
      margin-top: -100px;
      border: 4px solid white;
      border-radius: 50%;
      opacity: 0.5;
      z-index: 0;
    }

    /* Pola karne */
    .penalty-box {
      position: fixed;
      width: 100px;
      height: 180px;
      border: 4px solid white;
      opacity: 0.5;
      z-index: 0;
      top: 50%;
      transform: translateY(-90px);
    }

    .left-box {
      left: 0;
      border-right: none;
    }

    .right-box {
      right: 0;
      border-left: none;
    }

    header, main, footer {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    header {
      background-color: rgba(30, 132, 73, 0.95);
      padding: 20px;
    }

    header svg {
      width: 50px;
      vertical-align: middle;
      margin-right: 10px;
    }

    main {
      padding: 50px 20px;
      background-color: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      margin: 30px auto;
      max-width: 800px;
    }

    .construction-icon {
      width: 100px;
      margin: 30px auto;
    }

    footer {
      background-color: rgba(20, 90, 50, 0.95);
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    img {
      width: 160px;
      padding-bottom: 0;
      margin-bottom: 0;

    }
  </style>
</head>
<body>
  <!-- Linie boiska -->
  <div class="mid-line"></div>
  <div class="center-circle"></div>
  <div class="penalty-box left-box"></div>
  <div class="penalty-box right-box"></div>

  <header>
    <img src="/static/pewniaczkilogo.png" alt="Logo"/>

    <p>Predykcje wyników meczów piłkarskich</p>
  </header>

  <main>
    <h2>⚽ Projekt w budowie ⚽</h2>
    <div class="construction-icon">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#f1c40f">
        <path d="M32 2a30 30 0 1 0 30 30A30 30 0 0 0 32 2zm0 4a26 26 0 1 1-26 26A26 26 0 0 1 32 6zm-3 10v20h6V16zm0 24v6h6v-6z"/>
      </svg>
    </div>
    <p><strong>Już wkrótce znajdziesz tu typy, analizy i wyniki meczów!</strong></p>
  </main>

  <footer>
    &copy; 2025 Pewniaczki ⚽ Wszystkie prawa zastrzeżone.
  </footer>
</body>
</html>
