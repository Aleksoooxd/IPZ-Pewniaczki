{% extends "base.html" %}

{% block title %}{{ team_name }} - Szczegóły Drużyny{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/team.css') }}">
{% endblock %}

{% block content %}
<div class="team-detail-container card">
  <h2 class="page-title">{{ team_name }}</h2>
  <p class="info-message">Szczegóły drużyny z ligi {{ league_name }} wkrótce...</p>
  <a href="{{ url_for('main.league_view', league_code=league_code) }}" class="button secondary">← Powrót do ligi</a>
</div>
{% endblock %}
