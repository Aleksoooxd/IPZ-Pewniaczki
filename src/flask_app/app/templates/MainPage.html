<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pewniaczki</title>
    <style>
        body {
            background: repeating-linear-gradient(
                to right,
                #006400, #006400 50px,
                #008000 50px, #008000 100px
            );
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .container {
            display: flex;
            justify-content: space-between;
            padding: 20px;
        }
        .button {
            background-color: white;
            color: black;
            padding: 10px 20px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            margin: 5px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .league-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 220px;
            position: absolute;
            top: 50px;
            left: 20px;
        }
        .logo-placeholder img {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        .league-selection {
            background-color: white;
            color: black;
            padding: 10px;
            border-radius: 10px;
            text-align: left;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .league-button {
            background-color: #ffcccc;
            padding: 10px;
            margin: 5px 0;
            border-radius: 5px;
            border: none;
            width: 100%;
            text-align: center;
            cursor: pointer;
            font-size: 16px;
        }
        .matches {
            flex-grow: 1;
            margin-left: 250px;
        }
        .match-card {
            background-color: white;
            color: black;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .match-time {
            font-weight: bold;
        }
        .team {
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Pewniaczki</h1>
    <div class="button-container">
        <button class="button">YESTERDAY</button>
        <button class="button">TODAY</button>
        <button class="button">TOMORROW</button>
    </div>
    <div class="container">
        <div class="league-container">
            <div class="logo-placeholder">
                <img src="../static/pewniaczkilogo.png" alt="Logo">
            </div>
            <div class="league-selection">
                <h1>Select League</h1>
                <button class="league-button">Bundesliga</button>
                <button class="league-button">Eredivise</button>
                <button class="league-button">EthnikiKatigoria</button>
                <button class="league-button">FutbolLig1</button>
                <button class="league-button">JupiterLeague</button>
                <button class="league-button">LaLiga</button>
                <button class="league-button">Ligue1</button>
                <button class="league-button">LigaI</button>
                <button class="league-button">Scotish Premier League</button>
                <button class="league-button">SerieA</button>
            </div>
        </div>
        <div class="matches">
            <div class="match-card">
                <span class="match-time">21:00</span>
                <span class="team">TEAM A</span>
                <span>vs</span>
                <span class="team">TEAM B</span>
                <button class="button">Predict</button>
            </div>
            <div class="match-card">
                <span class="match-time">21:00</span>
                <span class="team">TEAM C</span>
                <span>vs</span>
                <span class="team">TEAM D</span>
                <button class="button">Predict</button>
            </div>
            <div class="match-card">
                <span class="match-time">21:00</span>
                <span class="team">TEAM E</span>
                <span>vs</span>
                <span class="team">TEAM F</span>
                <button class="button">Predict</button>
            </div>
        </div>

    </div>
</body>
</html>
