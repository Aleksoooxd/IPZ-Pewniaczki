{% extends "base.html" %}

{% block title %}{{ _('Pewniaczki - Mecze') }}{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
{% endblock %}

{% block content %}
<div class="main-content-wrapper">
  <div class="date-container card">
    <div class="date-controls">
      <div class="control-group">
        <label for="date-picker">{{ _('Wybierz datę:') }}</label>
        <input type="date" id="date-picker" class="date-picker">
        <button class="button primary" onclick="redirectToMatches()">{{ _('Pokaż mecze') }}</button>
      </div>
      <div class="control-group">
        <label for="league-filter">{{ _('Filtruj ligę:') }}</label>
        <select id="league-filter" class="date-picker" onchange="fetchMatches()">
          <option value="">{{ _('Wszystkie ligi') }}</option>
        </select>
      </div>
      <div class="control-group">
        <label for="sort-order">{{ _('Sortuj według:') }}</label>
        <select id="sort-order" class="date-picker" onchange="fetchMatches()">
          <option value="league-asc">{{ _('Ligi (A-Z)') }}</option>
          <option value="time-asc">{{ _('Godziny (rosnąco)') }}</option>
        </select>
      </div>
    </div>
  </div>

  <div class="matches" id="matches-container"></div>
</div>
{% endblock %}

{% block extra_script %}
<script>
  window.MAINPAGE_CONFIG = {
    leagueDisplayNames: {{ LEAGUE_DB_DISPLAY | tojson }},
    leagueFlagMap: {{ LEAGUE_DB_FLAG_SMALL | tojson }},
    flagsBaseUrl: "{{ url_for('static', filename='img/flags/') }}",
    msgPickDate:  {{ _('Proszę wybrać datę przed kliknięciem "Pokaż mecze".')|tojson }},
    msgNoMatches: "{{ _('Brak meczów dla wybranej daty.') }}",
    msgError:     "{{ _('Wystąpił błąd przy ładowaniu meczów.') }}",
    msgFinished:  "{{ _('Zakończony') }}",
    msgUpcoming:  "{{ _('Nadchodzący') }}"
  };
</script>
<script src="{{ url_for('static', filename='js/mainpage.js') }}"></script>
{% endblock %}
